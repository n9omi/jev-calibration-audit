# Offline demo: SYNTHETIC inventory series and simulated forecasters.
# Runs end to end with no API keys and no network, so CI can exercise the whole pipeline.
# Nothing produced by this config says anything about Jev or any real model.

run_name: demo
questions: configs/questions.yaml

data:
  source: synthetic
  dir: data/demo
  history_start: "2015-01-02"
  eval_start: "2023-01-06"
  eval_end: "2026-10-16"
  views: [with_changes, levels_only]
  unit_style: mixed
  anonymize_dates: true
  seed: 7

eia:
  series:
    crude:         { id: SYNTH.CRUDE,      units: kbbl,    name: "Synthetic commercial crude inventories" }
    gasoline:      { id: SYNTH.GASOLINE,   units: kbbl,    name: "Synthetic gasoline inventories" }
    distillate:    { id: SYNTH.DISTILLATE, units: kbbl,    name: "Synthetic distillate inventories" }
    cushing:       { id: SYNTH.CUSHING,    units: kbbl,    name: "Synthetic Cushing inventories" }
    refinery_util: { id: SYNTH.UTIL,       units: percent, name: "Synthetic refinery utilization" }

arms:
  rules:
    kind: rules
    eps: 0.01
  climatology:
    kind: climatology
    alpha: 1.0
  mock_calibrated:
    kind: mock
    skill: 1.5            # signal strength on horizon-0 questions
    forecast_skill: 0.25  # signal strength on horizon-1 questions
    sharpen: 1.0          # 1.0 = calibrated by construction
    seed: 1
  mock_overconfident:
    kind: mock
    skill: 1.5
    forecast_skill: 0.25
    sharpen: 2.5          # >1 pushes probabilities toward 0/1 -> overconfident
    seed: 2

evaluation:
  n_bins: 10
  bootstrap_n: 500
  bootstrap_seed: 11
  recal_folds: 5
  primary_pair: [mock_calibrated, mock_overconfident]
  reference_arm: climatology
